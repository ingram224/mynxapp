services:
  db:
    image: postgres:16-alpine
    container_name: mynx_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mynx_site
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mynx_site"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: mynx_app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/mynx_site
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
